<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="390" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <clipPath id="phoneClip">
      <rect x="0" y="0" width="390" height="800" rx="34" ry="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#phoneClip)">
    <!-- Background -->
    <rect x="0" y="0" width="390" height="800" fill="#181C1F"/>

    <!-- Status bar -->
    <text x="28" y="28" fill="#CFD6DC" font-size="13" font-weight="500">13:31</text>
    <g fill="#CFD6DC" transform="translate(310, 17)">
      <rect x="0" y="2" width="18" height="10" rx="2" fill="none" stroke="#CFD6DC" stroke-width="1.4"/>
      <rect x="2" y="4" width="13" height="6" rx="1"/>
      <rect x="19" y="5" width="2" height="4" rx="0.5"/>
      <text x="26" y="11" font-size="12" font-weight="500">98%</text>
    </g>

    <!-- Top App Bar -->
    <g stroke="#E4E8EC" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Down chevron -->
      <path d="M24 66 L32 74 L40 66"/>
      <!-- Star -->
      <polygon points="184,60 187.2,66.5 194.4,67.5 189.2,72.6 190.4,79.8 184,76.4 177.6,79.8 178.8,72.6 173.6,67.5 180.8,66.5" stroke-width="1.8"/>
      <!-- Sleep zZz -->
      <text x="220" y="75" fill="#E4E8EC" stroke="none" font-size="16" font-weight="700">zZ</text>
      <!-- Cast -->
      <rect x="262" y="61" width="20" height="15" rx="2" stroke-width="1.8"/>
      <path d="M262 72 A4 4 0 0 1 266 76 M262 68 A8 8 0 0 1 270 76" stroke-width="1.8"/>
      <!-- Share -->
      <circle cx="322" cy="63" r="2.3" fill="#E4E8EC" stroke="none"/>
      <circle cx="310" cy="70" r="2.3" fill="#E4E8EC" stroke="none"/>
      <circle cx="322" cy="77" r="2.3" fill="#E4E8EC" stroke="none"/>
      <path d="M312 69 L320 64 M312 71 L320 76" stroke-width="1.8"/>
      <!-- Overflow 3-dots -->
      <circle cx="362" cy="62" r="2" fill="#E4E8EC" stroke="none"/>
      <circle cx="362" cy="70" r="2" fill="#E4E8EC" stroke="none"/>
      <circle cx="362" cy="78" r="2" fill="#E4E8EC" stroke="none"/>
    </g>

    <!-- Circular Cover Art -->
    <circle cx="195" cy="215" r="102" fill="#0B0D0F" stroke="#2B3137" stroke-width="2"/>
    <g stroke="#E4E8EC" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="180" y="168" width="30" height="52" rx="15" fill="#181C1F"/>
      <path d="M166 205 A29 29 0 0 0 224 205"/>
      <line x1="195" y1="234" x2="195" y2="254"/>
      <line x1="178" y1="254" x2="212" y2="254"/>
    </g>
    <line x1="138" y1="274" x2="252" y2="274" stroke="#E4E8EC" stroke-width="3" stroke-linecap="round"/>

    <!-- Metadata & Shownotes -->
    <text x="195" y="346" text-anchor="middle" fill="#9AA3AB" font-size="14">Nov 24  •  Podcast Name</text>
    <text x="195" y="372" text-anchor="middle" fill="#EEF1F4" font-size="17" font-weight="500">Episode 417 — Deep Dive</text>

    <!-- Shownotes button -->
    <rect x="128" y="392" width="134" height="36" rx="8" fill="none" stroke="#6B747C" stroke-width="1.4"/>
    <text x="195" y="415" text-anchor="middle" fill="#CFD6DC" font-size="14">ⓘ  Shownotes</text>

    <!-- Seekbar -->
    <line x1="24" y1="468" x2="366" y2="468" stroke="#3A4248" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="468" x2="132" y2="468" stroke="#4E8DF5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="132" cy="468" r="8" fill="#4E8DF5"/>

    <!-- Enlarged 18sp Timestamps -->
    <text x="24" y="500" fill="#B5BDC4" font-size="18" font-weight="500">00:12:00</text>
    <text x="366" y="500" text-anchor="end" fill="#B5BDC4" font-size="18" font-weight="500">-00:34:22</text>

    <!-- Redesigned Player Controls (176dp tall, 36dp side padding, 116dp Play button) -->
    <g transform="translate(0, 524)">
      <!-- Top-Left: Rewind (48dp at x=36..84, y=0..48) -->
      <g fill="#EEF1F4" transform="translate(36, 0)">
        <path d="M22 36 V12 L5 24 Z M39 36 V12 L22 24 Z"/>
        <text x="24" y="64" text-anchor="middle" fill="#9AA3AB" font-size="13">20</text>
      </g>

      <!-- Top-Right: Fast Forward (48dp at x=306..354, y=0..48) -->
      <g fill="#EEF1F4" transform="translate(306, 0)">
        <path d="M9 36 L26 24 L9 12 Z M26 36 L43 24 L26 12 Z"/>
        <text x="24" y="64" text-anchor="middle" fill="#9AA3AB" font-size="13">30</text>
      </g>

      <!-- Center: Enlarged 116dp Circular Play Button (cx=195, cy=88, r=58) -->
      <circle cx="195" cy="88" r="56" fill="none" stroke="#EEF1F4" stroke-width="2.5"/>
      <polygon points="181,62 222,88 181,114" fill="#EEF1F4"/>

      <!-- Bottom-Left: Playback Speed (48dp at x=36..84, y=108..156) -->
      <g transform="translate(36, 108)">
        <path d="M8 34 A18 18 0 1 1 40 34" fill="none" stroke="#EEF1F4" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="24" y1="28" x2="34" y2="17" stroke="#EEF1F4" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="24" cy="28" r="2.8" fill="#EEF1F4"/>
        <text x="24" y="64" text-anchor="middle" fill="#9AA3AB" font-size="13">1.00</text>
      </g>

      <!-- Bottom-Right: Skip (short press) / Delete & Mark Played (long press) (48dp at x=306..354, y=110..158) -->
      <g fill="#EEF1F4" transform="translate(306, 110)">
        <path d="M9 36 L28 24 L9 12 Z"/>
        <rect x="31" y="12" width="4.5" height="24" rx="1"/>
      </g>
    </g>

    <!-- Bottom Navigation Bar -->
    <rect x="0" y="732" width="390" height="68" fill="#121619"/>
    <line x1="0" y1="732" x2="390" y2="732" stroke="#262C31" stroke-width="1"/>

    <!-- Queue (active) -->
    <rect x="26" y="742" width="60" height="28" rx="14" fill="#2B3C52"/>
    <g stroke="#DCE8F8" stroke-width="2" stroke-linecap="round">
      <line x1="46" y1="751" x2="64" y2="751"/>
      <line x1="46" y1="756" x2="60" y2="756"/>
      <line x1="46" y1="761" x2="56" y2="761"/>
    </g>
    <text x="56" y="786" text-anchor="middle" fill="#DCE8F8" font-size="12" font-weight="600">Queue</text>

    <!-- Subscriptions -->
    <g stroke="#9AA3AB" stroke-width="1.8" fill="none">
      <rect x="138" y="747" width="8" height="8" rx="1.5"/>
      <rect x="150" y="747" width="8" height="8" rx="1.5"/>
      <rect x="138" y="759" width="8" height="8" rx="1.5"/>
      <rect x="150" y="759" width="8" height="8" rx="1.5"/>
    </g>
    <text x="148" y="786" text-anchor="middle" fill="#9AA3AB" font-size="12">Subscriptions</text>

    <!-- Episodes -->
    <g stroke="#9AA3AB" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M236 765 A12 12 0 0 1 248 753 M236 765 A6 6 0 0 1 242 759"/>
      <circle cx="237" cy="765" r="1.5" fill="#9AA3AB"/>
    </g>
    <text x="242" y="786" text-anchor="middle" fill="#9AA3AB" font-size="12">Episodes</text>

    <!-- More -->
    <g fill="#9AA3AB">
      <circle cx="334" cy="750" r="2"/>
      <circle cx="334" cy="757" r="2"/>
      <circle cx="334" cy="764" r="2"/>
    </g>
    <text x="334" y="786" text-anchor="middle" fill="#9AA3AB" font-size="12">More</text>
  </g>

  <!-- Outer Phone Frame Border -->
  <rect x="1.5" y="1.5" width="387" height="797" rx="33" ry="33" fill="none" stroke="#2F363C" stroke-width="3"/>
</svg>
